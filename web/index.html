<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>godom</title>
  <!-- daisyUI（btn, card などのコンポーネントクラス）。Tailwind より先に読み込む -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet" type="text/css">
  <!-- Tailwind CSS（ブラウザ版）。DOMを監視して、後から追加された class にもスタイルを当てる -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm", { cache: "no-store" }) /* 開発中は毎回最新の wasm を読む */, go.importObject)
      .then((result) => go.run(result.instance))
      .catch((err) => console.error(err));
  </script>
</head>

<body>
  <div id="app"></div>
</body>

</html>
